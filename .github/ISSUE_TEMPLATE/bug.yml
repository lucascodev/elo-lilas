name: Problema no site
description: Algo não funciona, não aparece ou está difícil de usar.
title: "[Problema]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Esta issue é pública. **Não escreva dados pessoais seus ou de outra pessoa.**
        Se o problema expõe quem acessa o site, use o [relato privado](https://github.com/lucascodev/elo-lilas/security/advisories/new).
  - type: input
    id: page
    attributes:
      label: Página
      placeholder: https://lucascodev.github.io/elo-lilas/entenda/
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir a página...
        2. Tocar em...
  - type: input
    id: device
    attributes:
      label: Dispositivo e navegador
      placeholder: Android, Chrome 142
